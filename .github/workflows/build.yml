name: Build Aseprite

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download Skia
        shell: powershell
        run: |
          Invoke-WebRequest `
            -Uri "https://github.com/aseprite/skia/releases/download/m124-08a5439a6b/Skia-Windows-Release-x64.zip" `
            -OutFile "skia.zip"
          Expand-Archive skia.zip -DestinationPath C:\deps\skia

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Configure
        shell: cmd
        run: |
          cmake -B build ^
            -DCMAKE_BUILD_TYPE=RelWithDebInfo ^
            -DLAF_BACKEND=skia ^
            -DSKIA_DIR=C:\deps\skia ^
            -DSKIA_LIBRARY_DIR=C:\deps\skia\out\Release-x64 ^
            -DSKIA_LIBRARY=C:\deps\skia\out\Release-x64\skia.lib ^
            -G Ninja

      - name: Build
        shell: cmd
        run: |
          cmake --build build --config RelWithDebInfo

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aseprite-windows
          path: build/bin/
